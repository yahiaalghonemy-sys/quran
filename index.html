<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style></head><body><title>متابعة قراءة الإمام</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* التخطيط: شريط تحكم رفيع فوق، والمصحف مفتوح بصفحتين (أو صفحة على الموبايل) يملأ الشاشة */
:root{
  --bg:#e9ece6;        /* خلفية حوالين المصحف */
  --paper:#fbfaf4;     /* ورق الصفحة */
  --ink:#1d241f;       /* حبر النص */
  --frame:#2f6b55;     /* إطار وزخرفة المصحف */
  --muted:#5f6b63;
  --mark:#f2dc8a;      /* تعليم الآية الحالية */
  --bar:#ffffff;
  --live:#c2412d;
  --line:#cfd6cc;
  --quran:"Amiri Quran","Amiri",serif;
  --ui:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512;--paper:#18201b;--ink:#e6e4d8;--frame:#6fb394;--muted:#9aa79e;--mark:#5a4b17;--bar:#141b17;--live:#ef7a62;--line:#2a352e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--paper:#18201b;--ink:#e6e4d8;--frame:#6fb394;--muted:#9aa79e;--mark:#5a4b17;--bar:#141b17;--live:#ef7a62;--line:#2a352e;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);direction:rtl;display:flex;flex-direction:column;overflow:hidden}
button{font-family:var(--ui);font-size:15px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--frame);outline-offset:2px}

.bar{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.listen{display:flex;align-items:center;gap:8px;background:var(--frame);color:var(--paper);border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.listen .dot{width:10px;height:10px;border-radius:50%;background:var(--paper);opacity:.6}
.listen.on{background:var(--live)}
.listen.on .dot{opacity:1;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(.55)}}
@media (prefers-reduced-motion:reduce){.listen.on .dot{animation:none}}
.where{display:flex;flex-direction:column;min-width:0;flex:1}
.where b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:6px}
.nav button,.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px}

.stage{flex:1;min-height:0;display:flex;justify-content:center;gap:0;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.page{flex:1;max-width:620px;min-width:0;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;padding:10px;position:relative}
.stage.spread .page:first-child{border-left:0;box-shadow:inset -14px 0 18px -16px rgba(0,0,0,.35)}
.stage.spread .page:last-child{box-shadow:inset 14px 0 18px -16px rgba(0,0,0,.35)}
.inner{flex:1;min-height:0;border:2px solid var(--frame);outline:1px solid var(--frame);outline-offset:3px;display:flex;flex-direction:column;padding:8px 14px}
.phead{display:flex;justify-content:space-between;font-size:12px;color:var(--frame);border-bottom:1px solid var(--line);padding-bottom:4px;font-weight:500}
.text{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;position:relative;font-family:var(--quran);text-align:justify;text-align-last:center;line-height:2.05;padding-top:4px}
.text.short{display:flex;flex-direction:column;justify-content:center}
.pnum{text-align:center;font-size:13px;color:var(--frame);padding-top:4px;font-variant-numeric:tabular-nums}
.sura{display:block;text-align:center;border:1.5px solid var(--frame);border-radius:4px;margin:.25em 0;padding:.05em 0;font-size:.9em;color:var(--frame);background:color-mix(in srgb,var(--frame) 8%,transparent)}
.basm{display:block;text-align:center}
.ay{border-radius:6px;transition:background .3s;cursor:pointer}
.ay.cur{background:var(--mark)}
.num{color:var(--frame);white-space:nowrap}
.loading{margin:auto;color:var(--muted);font-size:16px;text-align:center;line-height:1.8}

.test{background:var(--bar);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.test p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font-family:var(--ui);font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.row button{background:var(--frame);color:var(--paper);border:0;border-radius:8px;padding:0 16px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px}
.heard{font-size:13px;color:var(--muted);min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

<header class="bar">
  <button class="listen" id="listen" type="button"><span class="dot"></span><span id="listenTxt">ابدأ الاستماع</span></button>
  <div class="where"><b id="where">في انتظار قراءة الإمام</b><small id="status">اضغط «ابدأ الاستماع» قبل الصلاة</small></div>
  <div class="nav">
    <button type="button" id="prev" aria-label="الصفحة السابقة">→ السابقة</button>
    <button type="button" id="next" aria-label="الصفحة التالية">التالية ←</button>
    <button type="button" class="ghost" id="toggleTest">تجربة</button>
  </div>
</header>

<main class="stage" id="stage"><p class="loading" id="loading">جاري تحميل المصحف…</p></main>

<section class="test" id="test" hidden>
  <p id="testNote">جرّب من غير ميكروفون: اكتب كلمات من أي آية زي ما بتسمعها (من غير تشكيل)، والبرنامج يفتح صفحتها ويعلّم الآية.</p>
  <div class="row"><input id="q" type="text" placeholder="مثال: الذين يؤمنون بالغيب ويقيمون الصلاة" autocomplete="off"><button type="button" id="go">ابحث</button></div>
  <div class="chips" id="chips"></div>
  <div class="heard" id="heard"></div>
</section>

<script>
window.onerror=function(m){ var l=document.getElementById('loading'); if(l) l.textContent='حصلت مشكلة في التحميل: '+m; };
// محرك التعرف على موضع القراءة في المصحف
// يحوّل النص لحروف فقط (بدون تشكيل ولا ألف ولا همزات) ويبحث بالـ n-grams
var Engine = (function () {
  var N = 4;
  var MAX_OCC = 1500; // n-gram شائع جداً لا يفيد في التمييز

  function norm(s) {
    return s
      .replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g, '')
      .replace(/[ٱآأإ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي')
      .replace(/ء/g, '')
      .replace(/[^ب-ي\s]/g, ' ')
      .replace(/ا/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // عبارات الصلاة اللي مش من القراءة
  var NOISE = ['لله كبر', 'سمع لله لمن حمده', 'ربن ولك لحمد', 'مين', 'لسلم عليكم ورحمه لله'];
  function stripNoise(t) {
    NOISE.forEach(function (p) { t = t.split(p).join(' '); });
    return t.replace(/\s+/g, ' ').trim();
  }

  function build(ayat) {
    var parts = [], owner = [], len = 0;
    for (var i = 0; i < ayat.length; i++) {
      var t = norm(ayat[i][3]).replace(/ /g, '');
      parts.push(t);
      for (var k = 0; k < t.length; k++) owner.push(i);
      len += t.length;
    }
    var text = parts.join('');
    var start = new Int32Array(ayat.length + 1), p = 0;
    for (i = 0; i < ayat.length; i++) { start[i] = p; p += parts[i].length; }
    start[ayat.length] = p;
    var index = new Map();
    for (i = 0; i + N <= text.length; i++) {
      var g = text.substr(i, N), arr = index.get(g);
      if (!arr) index.set(g, [i]); else if (arr.length <= MAX_OCC) arr.push(i);
    }
    return { text: text, owner: Int16Array.from(owner), start: start, index: index, ayat: ayat };
  }

  // البحث: يرجع موضع آخر حرف اتقرا (رقم الآية) ومدى الثقة
  // near: موضع آخر معروف (حرف) لتفضيل الاستمرار من نفس المكان
  function locate(db, raw, near) {
    var q = stripNoise(norm(raw)).replace(/ /g, '');
    if (q.length > 70) q = q.slice(-70);
    if (q.length < 10) return null;
    var grams = q.length - N + 1, votes = new Map();
    for (var j = 0; j < grams; j++) {
      var occ = db.index.get(q.substr(j, N));
      if (!occ || occ.length > MAX_OCC) continue;
      var w = 1 / Math.log2(2 + occ.length);
      for (var k = 0; k < occ.length; k++) {
        var b = ((occ[k] - j) >> 3);
        votes.set(b, (votes.get(b) || 0) + w);
      }
    }
    var best = null, bestScore = 0;
    votes.forEach(function (v, b) {
      var s = v + (votes.get(b - 1) || 0) * 0.8 + (votes.get(b + 1) || 0) * 0.8;
      var startChar = b << 3;
      if (near != null && startChar > near - 400 && startChar < near + 4000) s *= 1.6;
      if (s > bestScore) { bestScore = s; best = b; }
    });
    if (best === null) return null;
    // الثقة = النسبة من أقصى نتيجة ممكنة لو كل الـ grams نادرة ومتطابقة
    var conf = bestScore / (grams * 0.5);
    var endChar = Math.min((best << 3) + q.length, db.text.length - 1);
    // نصحح نهاية المطابقة: آخر n-gram من الاستعلام اتلقى قريب من النهاية المتوقعة
    var tail = q.substr(q.length - N), occT = db.index.get(tail);
    if (occT) {
      for (var t = 0; t < occT.length; t++) {
        if (Math.abs(occT[t] + N - 1 - endChar) < 24) { endChar = occT[t] + N - 1; break; }
      }
    }
    return { ayah: db.owner[endChar], char: endChar, conf: conf };
  }

  return { norm: norm, build: build, locate: locate };
})();



function loadData(){
  var b64=document.getElementById('qd').textContent.trim();
  if(b64.length<1000) return Promise.reject(new Error('ملف البرنامج ناقص — نزّله تاني'));
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(!window.DecompressionStream) return Promise.reject(new Error('حدّث Chrome لآخر إصدار'));
  var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).text().then(JSON.parse);
}
loadData().then(boot).catch(function(e){
  document.getElementById('loading').textContent='مش قادر أحمّل المصحف: '+e.message;
});

function boot(DATA){
  var A = DATA.ayat, NAMES = DATA.names;
  var db = Engine.build(A);
  var pages = []; // pages[p] = [ayah indexes]
  A.forEach(function(a,i){ (pages[a[2]] = pages[a[2]] || []).push(i); });
  var JUZ_START = [1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
  function juzOf(p){ var j=1; for(var i=0;i<30;i++) if(p>=JUZ_START[i]) j=i+1; return j; }
  var AR = '٠١٢٣٤٥٦٧٨٩';
  function ar(n){ return String(n).replace(/\d/g,function(d){return AR[d];}); }

  var stage = document.getElementById('stage');
  var curPage = 1, curAyah = -1, lastChar = null;

  function isSpread(){ return window.innerWidth > window.innerHeight && window.innerWidth >= 760; }

  function renderPage(p){
    var el = document.createElement('section'); el.className = 'page';
    if(p < 1 || p > 604){ el.style.visibility='hidden'; return el; }
    var list = pages[p], first = A[list[0]];
    if(curAyah>=0 && A[curAyah][2]===p) first = A[curAyah];
    var html = '';
    list.forEach(function(i){
      var a = A[i];
      if(a[1] === 1){
        html += '<span class="sura">سورة '+NAMES[a[0]-1]+'</span>';
        if(a[0] !== 1 && a[0] !== 9) html += '<span class="basm">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</span>';
      }
      html += '<span class="ay'+(i===curAyah?' cur':'')+'" data-i="'+i+'">'+a[3]+' <span class="num">﴿'+ar(a[1])+'﴾</span></span> ';
    });
    el.innerHTML = '<div class="inner"><div class="phead"><span>سورة '+NAMES[first[0]-1]+'</span><span>الجزء '+ar(juzOf(p))+'</span></div>'+
      '<div class="text'+(p<=2?' short':'')+'">'+html+'</div><div class="pnum">'+ar(p)+'</div></div>';
    return el;
  }

  // تكبير الخط لأقصى حجم يدخل في الصفحة من غير ما يتقص
  function fit(textEl){
    var lo=17, hi=44;
    for(var k=0;k<9;k++){
      var mid=(lo+hi)/2; textEl.style.fontSize=mid+'px';
      if(textEl.scrollHeight <= textEl.clientHeight+1) lo=mid; else hi=mid;
    }
    textEl.style.fontSize=lo+'px';
  }

  function render(){
    stage.innerHTML='';
    var spread = isSpread();
    stage.classList.toggle('spread', spread);
    var ps = spread ? (curPage%2 ? [curPage, curPage+1] : [curPage-1, curPage]) : [curPage];
    ps.forEach(function(p){ stage.appendChild(renderPage(p)); });
    stage.querySelectorAll('.text').forEach(fit);
    showCurrent();
    updateBar();
  }

  // لو الصفحة أطول من الشاشة، ننزل لحد الآية الحالية عشان تبان
  function showCurrent(){
    var el = stage.querySelector('.ay.cur'); if(!el) return;
    var box = el.closest('.text');
    if(box.scrollHeight > box.clientHeight + 1)
      box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight/3);
  }

  function updateBar(){
    var a = curAyah>=0 ? A[curAyah] : null;
    document.getElementById('where').textContent = a
      ? 'سورة '+NAMES[a[0]-1]+' · آية '+ar(a[1])
      : 'صفحة '+ar(curPage);
    if(a) document.getElementById('status').textContent = 'صفحة '+ar(a[2])+' · الجزء '+ar(juzOf(a[2]));
  }

  function setAyah(i, fromSpeech){
    var changedPage = A[i][2] !== curPage;
    var shownBefore = isSpread() && Math.ceil(A[i][2]/2) === Math.ceil(curPage/2);
    curAyah = i; curPage = A[i][2]; lastChar = db.start[i+1]-1;
    if(changedPage && !shownBefore) render();
    else {
      stage.querySelectorAll('.ay.cur').forEach(function(e){ e.classList.remove('cur'); });
      var el = stage.querySelector('.ay[data-i="'+i+'"]'); if(el) el.classList.add('cur');
      showCurrent();
      updateBar();
    }
  }

  function step(d){
    var n = isSpread() ? (curPage%2 ? curPage : curPage-1) + 2*d : curPage + d;
    curPage = Math.max(1, Math.min(604, n)); render();
  }
  document.getElementById('prev').onclick=function(){ step(-1); };
  document.getElementById('next').onclick=function(){ step(1); };
  stage.addEventListener('click', function(e){
    var ay = e.target.closest('.ay'); if(ay) setAyah(+ay.dataset.i);
  });
  // سحب باليد لقلب الصفحة (الاتجاه زي المصحف)
  var sx=null;
  stage.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  stage.addEventListener('touchend',function(e){
    if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)>60) step(dx>0?1:-1);
  });
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(render,150); });

  // ===== المطابقة =====
  var statusEl = document.getElementById('status'), heardEl = document.getElementById('heard');
  function handle(text, fromSpeech){
    var near = lastChar;
    var r = Engine.locate(db, text, near);
    if(!r) return false;
    var nearHit = near!=null && r.char > near-400 && r.char < near+4000;
    if(r.conf < (nearHit ? 0.24 : 0.28)) { if(!fromSpeech) statusEl.textContent='مش لاقي الآية دي — جرّب كلمات أكتر'; return false; }
    if(A[r.ayah][0] === 1){ statusEl.textContent='الإمام بيقرأ الفاتحة… في انتظار السورة'; return 'fatiha'; }
    setAyah(r.ayah, fromSpeech);
    return true;
  }

  // ===== وضع التجربة =====
  var testEl = document.getElementById('test'), qEl = document.getElementById('q');
  document.getElementById('toggleTest').onclick=function(){ testEl.hidden=!testEl.hidden; render(); };
  document.getElementById('go').onclick=function(){ heardEl.textContent='كتبت: '+qEl.value; handle(qEl.value,false); };
  qEl.addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('go').click(); });
  ['الذين يؤمنون بالغيب ويقيمون الصلاة','تبارك الذي بيده الملك','والضحى والليل اذا سجى','الحمد لله رب العالمين','فباي الاء ربكما تكذبان'].forEach(function(s){
    var b=document.createElement('button'); b.type='button'; b.textContent=s;
    b.onclick=function(){ qEl.value=s; document.getElementById('go').click(); };
    document.getElementById('chips').appendChild(b);
  });

  // ===== الاستماع =====
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec=null, listening=false, buffer='', wake=null, lastRun=0;
  var btn=document.getElementById('listen'), btnTxt=document.getElementById('listenTxt');

  function noMic(msg){
    listening=false; btn.classList.remove('on'); btnTxt.textContent='ابدأ الاستماع';
    statusEl.textContent=msg; testEl.hidden=false;
    document.getElementById('testNote').textContent=msg+' — تقدر تجرّب بالكتابة هنا.';
    render();
  }

  var inFrame = (function(){ try{ return window.self !== window.top; }catch(_){ return true; } })();
  var watchdog=null, started=false;

  function startRec(){
    // رد فعل فوري عشان المستخدم يعرف إن الزرار اشتغل
    btnTxt.textContent='بيجهّز الميكروفون…';
    statusEl.textContent='لو ظهر طلب إذن للميكروفون اختار «سماح»';
    if(inFrame){ noMic('الميكروفون مقفول جوّه تطبيق Claude — افتح ملف البرنامج في Chrome'); return; }
    if(!SR){ noMic('المتصفح ده مش بيدعم التعرّف على الصوت — افتحه في Chrome'); return; }
    started=false;
    rec = new SR(); rec.lang='ar-SA'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onstart=function(){
      started=true; clearTimeout(watchdog);
      btn.classList.add('on'); btnTxt.textContent='بيستمع… اضغط للإيقاف';
      statusEl.textContent='بيستمع للإمام';
    };
    rec.onresult=function(e){
      var interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal) buffer=(buffer+' '+t).slice(-220); else interim+=' '+t;
      }
      var all=(buffer+' '+interim).trim();
      heardEl.textContent='سمعت: '+all.slice(-80);
      var now=Date.now(); if(now-lastRun<350) return; lastRun=now;
      if(handle(all.slice(-120),true)==='fatiha') buffer='';
    };
    rec.onerror=function(e){
      clearTimeout(watchdog);
      if(e.error==='not-allowed'||e.error==='service-not-allowed')
        noMic(location.protocol==='file:' ? 'Chrome رافض الميكروفون للملف المفتوح من الجهاز — محتاج يتفتح من لينك https' : 'إذن الميكروفون مرفوض — اسمح بيه من إعدادات الموقع في Chrome');
      else if(e.error==='audio-capture') noMic('مش لاقي ميكروفون شغّال على الجهاز');
      else if(e.error==='network') statusEl.textContent='التعرّف على الصوت محتاج إنترنت في النسخة دي';
      else if(e.error!=='no-speech' && e.error!=='aborted') statusEl.textContent='مشكلة في الاستماع ('+e.error+') — بيحاول تاني';
    };
    rec.onend=function(){ if(listening){ try{ rec.start(); }catch(_){} } };
    try{ rec.start(); }catch(err){ noMic('مش قادر أشغّل الميكروفون'); return; }
    listening=true;
    // لو مفيش أي رد خلال ٥ ثواني، نقول السبب بدل ما الزرار يبان واقف
    watchdog=setTimeout(function(){
      if(started) return;
      try{ rec.stop(); }catch(_){}
      noMic('الميكروفون ما اشتغلش — افتح البرنامج في Chrome من لينك https');
    },5000);
    if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake=w; }).catch(function(){});
  }
  function stopRec(){
    clearTimeout(watchdog); listening=false; if(rec) try{ rec.stop(); }catch(_){}
    btn.classList.remove('on'); btnTxt.textContent='ابدأ الاستماع'; statusEl.textContent='الاستماع متوقف';
    if(wake){ wake.release().catch(function(){}); wake=null; }
  }
  btn.onclick=function(){ listening?stopRec():startRec(); };
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible' && listening && navigator.wakeLock)
      navigator.wakeLock.request('screen').then(function(w){ wake=w; }).catch(function(){});
  });

  render();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  // فتح على مثال عشان الصفحة تبان شغالة من أول نظرة
  handle('الذين يؤمنون بالغيب ويقيمون الصلاة', false);
  statusEl.textContent = 'مثال: البقرة آية ٣ — اضغط «ابدأ الاستماع» قبل الصلاة';
}
</script>
<!-- نهاية الملف -->
</body></html>
